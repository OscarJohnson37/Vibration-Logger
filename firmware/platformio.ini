; Logger ecosystem firmware: one PlatformIO project, one environment per logger type.
; Each logger's entry point lives in loggers/<name>/; shared code goes in lib/.
;
;   pio run -e bench_adxl345 -t upload      build + flash one logger
;   pio device monitor                       serial monitor

[platformio]
src_dir = loggers
default_envs = bench_adxl345

; Settings shared by every TinyS3[D]-based logger.
; The TinyS3[D] uses the same pinout/memory as the TinyS3, so the um_tinys3 board definition works.
[tinys3d]
platform = espressif32
board = um_tinys3
framework = arduino
monitor_speed = 115200
; Native USB port as seen on this PC - change if Windows assigns a different COM number
monitor_port = COM22
upload_port = COM22
; Don't toggle DTR/RTS when opening the monitor (on native USB this can reset the board)
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Breadboard bring-up: ADXL345 streamed over USB for tools/accel-viewer (temporary)
[env:bench_adxl345]
extends = tinys3d
build_src_filter = +<bench_adxl345/>
