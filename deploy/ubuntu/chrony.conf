# The master is the loggers' time source (MQTT.md, Time sync). Installed as
# /etc/chrony/conf.d/logger-master.conf.
#
# Loggers use the broker's host as their NTP server by default, so serve the hotspot network
# (NetworkManager "shared" mode: 10.42.0.0/24). Add the Ethernet LAN here if loggers sit there too.
allow 10.42.0.0/24

# With internet (e.g. over Ethernet) chrony follows its normal upstream servers. Without it, keep
# serving time from this PC's own clock (its RTC keeps time across power-offs).
local stratum 10
