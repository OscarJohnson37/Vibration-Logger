# Logger ecosystem broker (protocol/MQTT.md). Installed as /etc/mosquitto/conf.d/logger.conf.
# Listens on every interface, so loggers on the hotspot (10.42.0.1) and on Ethernet reach it.
listener 1883

# Per-site username and password (MQTT.md, Security). setup.sh creates the password file;
# every logger needs the same credentials in core.mqtt_user / core.mqtt_password.
allow_anonymous false
password_file /etc/mosquitto/logger.passwd

# Development only: no credentials. setup.sh writes this instead when run with no password.
#allow_anonymous true

# Retained info/status/config must survive a restart, so the dashboard knows every logger at once
persistence true
